# nginx reverse proxy for Mira.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.yml.
#
# Before first start:
#   1. Put your certificate as deploy/nginx/certs/fullchain.pem
#      and your private key as deploy/nginx/certs/privkey.pem
#      (e.g. from certbot / acme.sh / your CA).
#      First-time issuance, while nginx is stopped:
#        sudo certbot certonly --standalone -d petrus-mira.duckdns.org
#        cp /etc/letsencrypt/live/petrus-mira.duckdns.org/fullchain.pem deploy/nginx/certs/
#        cp /etc/letsencrypt/live/petrus-mira.duckdns.org/privkey.pem  deploy/nginx/certs/
#      Renewals can use the ACME webroot served below (deploy/nginx/acme).

upstream mira {
    server mira:8000;
    keepalive 32;
}

# WebSocket/SSE-safe upgrade mapping (harmless if unused).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name petrus-mira.duckdns.org;

    # Let's Encrypt HTTP-01 renewals (webroot: deploy/nginx/acme).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name petrus-mira.duckdns.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # GitHub webhook payloads can reach ~25 MB.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_proxied any;

    location / {
        proxy_pass http://mira;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
